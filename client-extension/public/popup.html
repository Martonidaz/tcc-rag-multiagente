<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuditAI - TCC Painel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 320px; padding: 15px; }
        .metric-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        h3 { margin-top: 0; font-size: 16px; color: #333; }
        .score { font-size: 24px; font-weight: bold; color: #0078D4; }
    </style>
</head>
<body>
    <h2>AuditAI: Observabilidade</h2>
    
    <div class="metric-card">
        <h3>Fidelidade RAGAS</h3>
        <div class="score" id="faithfulness-score">-- %</div>
    </div>
    
    <div class="metric-card">
        <h3>Relevância</h3>
        <div class="score" id="relevance-score">-- %</div>
    </div>
    
    <div class="metric-card">
        <h3>Entropia Semântica</h3>
        <div class="score" id="entropy-score">--</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
